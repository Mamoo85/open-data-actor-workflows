name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and check nothing drifted
        run: |
          python tools/generate.py
          git diff --exit-code
      - name: Validate JSON and connections
        run: python tools/validate.py
